<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker</title>
  <link rel="stylesheet" href="clicker.css">
  <link
  href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap"
  rel="stylesheet"
/>
</head>
<body>
  <div class="game">
    <h1 class="hi bye">hi</h1>
    <p class="hi" id="hi">hi</p>
    <p class="hi">hi</p>
    <p class="hi">hi</p>
    <p class="hi">hi</p>

    <button id="dark-mode-btn">Dark Mode</button>

    <h1>Cookie Clicker</h1>
    <h2>Idle clicker game.</h2>
    <img class="stars" src="stars.gif">

    <img id="cookie" src="image.png" alt="cookie">

    <button id="click-btn">Click</button>

    <p class="score">
      Clicks: <span id="score">0</span>
    </p>

    <button id="reset-btn">Reset Game</button>

    <h2>Achievements</h2>
    <div id="achievements"></div>
  </div>

  <script src="clicker.js"></script>
</body>
</html>
