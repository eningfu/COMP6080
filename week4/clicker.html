<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicker</title>
  <link rel="stylesheet" href="clicker.css">
</head>
<body>
  <div class="game">
    <div id="dark-mode-btn">Dark Mode</div>

    <h2>Cookie Clicker</h2>
    <h1>Idle clicker game.</h1>
    <img class="stars" src="stars.gif">

    <img id="cookie" src="image.png">

    <div id="click-btn">Click</div>

    <p class="score">
      Clicks: <span id="score">0</span>
    </p>

    <div id="reset-btn">Reset Game</div>
  </div>

  <script src="clicker.js"></script>
</body>
</html>
