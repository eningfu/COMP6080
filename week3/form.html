<!DOCTYPE html>
<html>
  <head>
    <title>My Form</title>
  </head>

  <body>
    <form action="" method="get">
      <label for="fname">First Name:</label>
      <input type="text" name="fname" id="fname">

      <label for="email">Email:</label>
      <input type="email" name="email" id="email">

      <input disabled type="submit" id="submit">

      <button id="btn">click me</button>

    </form>

    <script>
      const button = document.getElementById('btn');
      button.addEventListener('click', alert(1));

      const nameBox = document.getElementById('fname');
      const emailBox = document.getElementById('email');
      const submitBtn = document.getElementById('submit');

      const validName = () => {
        return /^[a-zA-Z]{2,20}$/.test(nameBox.value);
      };

      const validEmail = () => {
        return /.+@.+\..+/.test(emailBox.value);
      };

      const checkValid = () => {
        document.getElementById('submit').disabled = true;
        if (nameValid() && emailValid()) {
            document.getElementById('submit').disabled = false;
        }
      };

      nameBox.addEventListener('keyup', checkValid);

      nameBox.addEventListener('blur', () => {
        if (!validName()) {
          nameBox.style.backgroundColor = 'red';
        }
      });

      nameBox.addEventListener('focus', () => {
        nameBox.style.backgroundColor = 'white';
      });

      emailBox.addEventListener('keyup', checkValid);

      emailBox.addEventListener('blur', () => {
        if (!validEmail()) {
          emailBox.style.backgroundColor = 'red';
        }
      });

      emailBox.addEventListener('focus', () => {
        emailBox.style.backgroundColor = 'white';
      });
    </script>
  </body>
</html>
